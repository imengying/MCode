name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: MCode-amd64.tar.gz
            binary: mcode
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: MCode-arm64.tar.gz
            binary: mcode
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not a semantic version" >&2
            exit 1
          fi
          echo "MCODE_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install musl tools
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="mcode ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "release binary reports '$actual'; expected '$expected'" >&2
            exit 1
          fi

      - name: Package archive
        run: |
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} README.md LICENSE dist/package/
          tar -C dist/package -czf dist/${{ matrix.archive }} ${{ matrix.binary }} README.md LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes from commits
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(
            git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true
          )"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          {
            printf '## Changes\n\n'
            git log --no-merges \
              --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
              "$range"
            if [[ -n "$previous_tag" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
            fi
          } > release-notes.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.tar.gz
