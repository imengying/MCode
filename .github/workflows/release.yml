name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: mcode-x86_64-unknown-linux-musl.tar.gz
            binary: mcode
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: mcode-aarch64-unknown-linux-musl.tar.gz
            binary: mcode
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} README.md LICENSE dist/package/
          tar -C dist/package -czf dist/${{ matrix.archive }} ${{ matrix.binary }} README.md LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create deterministic source archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="mcode-${version}/" "$GITHUB_SHA" |
            gzip -n > "dist/mcode-${version}-source.tar.gz"

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum mcode-* > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/mcode-*
            dist/SHA256SUMS
