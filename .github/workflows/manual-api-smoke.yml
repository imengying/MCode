name: Manual OpenAI API smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI Responses model to test
        required: true
        default: gpt-5.6-terra

permissions:
  contents: read

jobs:
  smoke:
    name: Explicit paid API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require the repository secret
        run: test -n "$OPENAI_API_KEY"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Call the Responses API
        run: |
          ./target/release/mcode exec --search --model "${{ inputs.model }}" \
            "Reply with exactly: MCODE_SMOKE_OK" | tee /tmp/mcode-smoke.txt
          grep -F "MCODE_SMOKE_OK" /tmp/mcode-smoke.txt
