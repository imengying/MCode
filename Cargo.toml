[package]
name = "mcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "MCode, a terminal coding agent for Grok, DeepSeek, GLM, and Kimi"
license = "MIT"
publish = false

[lib]
name = "mcode"
path = "src/lib.rs"

[[bin]]
name = "mcode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
diffy = "0.5.1"
dom_query = { version = "0.28", features = ["markdown"] }
dom_smoothie = "0.18"
flate2 = "1.1"
futures-util = "0.3"
infer = { version = "0.22", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30", default-features = false, features = [
    "unstable-rendered-line-info",
] }
ratatui-crossterm = { version = "0.1", features = ["scrolling-regions"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.1", default-features = false, features = ["client", "transport-child-process"] }
rust-latex-parser = "0.1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
syntect = "5"
tar = "0.4"
term-maths = { version = "1.0", default-features = false }
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
url = "2.5"
uuid = { version = "1.12", features = ["serde", "v7"] }
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
