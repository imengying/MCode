[package]
name = "mcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "MCode, a focused OpenAI-compatible coding agent for the terminal"
license = "MIT"
publish = false

[lib]
name = "mcode"
path = "src/lib.rs"

[[bin]]
name = "mcode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0"
dom_query = { version = "0.28", features = ["markdown"] }
dom_smoothie = "0.18"
futures-util = "0.3"
infer = { version = "0.22", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.12", features = ["serde", "v7"] }

[dev-dependencies]
rmcp = { version = "2.2", default-features = false, features = ["server"] }
tempfile = "3.15"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
